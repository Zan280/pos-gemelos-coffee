services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    volumes:
      - type: bind
        source: ./  # Ruta en el host
        target: /code  # Ruta en el contenedor
    ports:
      - "3000:3000" # Cambia el puerto según sea necesario
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"
    networks:
      - app

networks:
  app:
   external: true
