server {
    listen 80;
    server_name localhost;
    client_max_body_size 25M;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Servir Frontend React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy a API Backend Django
    location /api/ {
        proxy_pass http://gemelos_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Proxy a Panel de Administración Django
    location /admin/ {
        proxy_pass http://gemelos_backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Servir archivos Media (imágenes de productos)
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Servir archivos Static del backend (Admin styles)
    location /backend-static/ {
        alias /staticfiles/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
