server {
    listen 80;
    server_name localhost;
    client_max_body_size 25M;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # 1. Estáticos del Panel de Administración de Django (prioridad alta)
    location /static/admin/ {
        alias /staticfiles/admin/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
     
    location /static/rest_framework/ {
        alias /staticfiles/rest_framework/;
    }

    # 2. Estáticos del Frontend React (JS, CSS e imágenes de la app)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 3. Proxy hacia la API REST de Django
    location /api/ {
        proxy_pass http://gemelos_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 4. Proxy hacia el Panel Admin de Django
    location /admin/ {
        proxy_pass http://gemelos_backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 5. Imágenes de productos (Media)
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 6. Frontend React SPA (captura la raíz y rutas de la SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
