services:
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: gemelos_backend
    restart: unless-stopped
    volumes:
      - ./app/backend:/code
    ports:
      - "8000:8000"
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./app/backend/.env
    environment:
      - DATABASE=mysql
      - SQL_ENGINE=django.db.backends.mysql
      - SQL_HOST=db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gemelos_net


  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: gemelos_frontend
    restart: unless-stopped
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - gemelos_net

  db:
    image: mysql:8.0
    container_name: gemelos_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - ./app/backend/.env
    environment:
      - MYSQL_ROOT_PASSWORD=${SQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${SQL_DATABASE:-mydb}
      - MYSQL_USER=${SQL_USER:-myuser}
      - MYSQL_PASSWORD=${SQL_PASSWORD:-db_password_placeholder}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${SQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gemelos_net

volumes:
  mysql_data:

networks:
  gemelos_net:
    driver: bridge
